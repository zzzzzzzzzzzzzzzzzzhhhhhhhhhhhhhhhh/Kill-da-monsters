name: Load game extras
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach extras to the game
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="extras.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body></html>',tag+'</body></html>')
              p.write_text(s,encoding='utf-8')
          w=Path('.github/workflows/load-extras.yml')
          if w.exists(): w.unlink()
      - name: Commit site patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Attach expanded game arsenal and monsters'
          git push